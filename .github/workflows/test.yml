name: contracts

on:
  push:
    branches: [main]
  pull_request:

# Explicit least-privilege token, not relying on the repo/org default
# (currently "read" too, checked directly -- but shouldn't depend on
# that staying true). No job pushes, comments, or writes anything --
# checkout, the static guard scripts, cargo test, Clippy, and the stellar
# contract build all only need read access.
permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path contracts/escrow/Cargo.toml

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --locked: fail rather than silently re-resolve if Cargo.lock is out
      # of sync with Cargo.toml -- a dependency must never float between a
      # local build and CI's build (issue #91).
      - name: cargo test
        working-directory: contracts/escrow
        run: cargo test --locked --verbose

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Report line coverage
        run: cargo llvm-cov --workspace --all-targets --locked

  # ---------------------------------------------------------------------
  # #2, #111, #122, #124, #125, and the window-overflow property suite —
  # six integration suites, each its own job so a failure points at the
  # issue it guards instead of at "cargo test". They are separate `--test`
  # targets under contracts/escrow/tests/, so the umbrella `test` job
  # above also runs them; these jobs exist so the signal is legible per
  # issue and so a suite can be re-run alone.
  # ---------------------------------------------------------------------

  permissionless-release-review:
    name: "#2 permissionless release review"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Pins docs/permissionless-release-review.md's conclusions: the two
      # tranche-opening calls need no signature, move no funds, write their
      # clock exactly once, and empower nobody — including the issue's
      # end-to-end third-party griefing scenario.
      - name: cargo test --test permissionless_release_review
        working-directory: contracts/escrow
        run: cargo test --test permissionless_release_review --verbose

  deadline-boundary:
    name: "#111 deadline boundary tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Exact-boundary coverage for advance1_deadline/advance2_deadline against
      # claim (inclusive at the deadline) and reclaim (exclusive).
      - name: cargo test --test deadline_boundary
        working-directory: contracts/escrow
        run: cargo test --test deadline_boundary --verbose

  address-equality:
    name: "#122 Address equality audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Every Address-vs-Address comparison in the contract compared by value,
      # plus a source-level guard against stringified identity comparisons.
      - name: cargo test --test address_equality
        working-directory: contracts/escrow
        run: cargo test --test address_equality --verbose

  oracle-fault-injection:
    name: "#124 Reflector oracle fault injection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Unreachable / panicking / garbage-returning / stale oracle against the
      # documented OracleNotConfigured / OraclePriceUnavailable / OracleStale
      # degradation paths.
      - name: cargo test --test oracle_fault_injection
        working-directory: contracts/escrow
        run: cargo test --test oracle_fault_injection --verbose

  snapshot-replay:
    name: "#125 deployment snapshot replay"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Replays the transcripts under contracts/escrow/tests/fixtures/ against
      # the current build. Green plus a printed divergence report; an
      # undeclared divergence fails. See fixtures/README.md.
      - name: cargo test --test snapshot_replay
        working-directory: contracts/escrow
        run: cargo test --test snapshot_replay -- --nocapture

  window-overflow:
    name: window overflow property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Property test: adding claim_window_secs/remainder_window_secs/
      # delivery_window_secs to a ledger timestamp either stores the exact
      # sum or refuses atomically -- never a wrapped-around deadline --
      # including deliberately adversarial near-u64::MAX inputs.
      - name: cargo test --test window_overflow
        working-directory: contracts/escrow
        run: cargo test --test window_overflow --verbose

  build-wasm:
    name: stellar contract build
    # Pinned, not floating `ubuntu-latest`: this job's native build
    # dependencies (libdbus-1-dev, libudev-dev — see below) are exactly the
    # kind that break silently when -latest re-points at a new image, which
    # is how this job broke twice before being caught. Pinning turns an
    # image change into an explicit, reviewable bump instead of a surprise;
    # bump the version deliberately and re-check the apt packages when you
    # do (issue #88).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # stellar-cli's dependency tree needs two system dev libraries to
      # compile from source, neither present on ubuntu-latest by default:
      # libdbus-sys (keyring support) needs dbus-1, and hidapi (hardware
      # wallet/Ledger support) needs libudev. Discovered one at a time --
      # dbus-1 broke this job silently for two prior runs (2 Sept 2026)
      # before being noticed and fixed; libudev surfaced immediately after
      # as the *next* missing dependency once dbus-1 was fixed, same
      # failure shape, different library.
      - name: Install stellar-cli's native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      # --locked: same reasoning as the test job above -- the wasm must be
      # built from the same pinned dependency set the rest of CI uses.
      - name: stellar contract build
        working-directory: .
        run: stellar contract build --locked

      - name: Verify WASM build reproducibility
        working-directory: .
        run: |
          # Build once more from a clean target directory and compare hashes.
          # If the two builds produce different WASM, this step fails.
          HASH_1=$(sha256sum target/wasm32v1-none/release/harvestlock_escrow.wasm | awk '{print $1}')
          rm -rf target
          stellar contract build --locked
          HASH_2=$(sha256sum target/wasm32v1-none/release/harvestlock_escrow.wasm | awk '{print $1}')
          echo "Build 1 hash: $HASH_1"
          echo "Build 2 hash: $HASH_2"
          if [ "$HASH_1" != "$HASH_2" ]; then
            echo "::error::WASM build is NOT reproducible — hashes differ between runs"
            exit 1
          fi
          echo "WASM build is reproducible (hash=$HASH_1)"

  # Regression safety nets one layer up from `cargo test`: both guard a
  # class of problem no single hand-written test is positioned to catch
  # once the offending PR is already merged.
  check-error-discriminants:
    name: error discriminants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if any `#[contracterror] Error` variant is inserted before an
      # existing one (a non-terminal discriminant shift), renumbered, or
      # removed -- see the script's own comment block for the exact rules.
      - name: Guard Error discriminant numbering
        run: bash .github/scripts/check_error_discriminants.sh

  check-auth-docs:
    name: auth doc comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if a public method's doc comment never names its required auth
      # party ("auth", "permissionless", "attestation", ...), or is missing
      # one entirely.
      - name: Guard public method auth doc comments
        run: bash .github/scripts/check_auth_docs.sh

  # Mutation testing (#62): deliberately break the code and require the test
  # suite to notice. A surviving mutant on a tested line means the assertion
  # looks stronger than it is. A full run is expensive (the baseline build is
  # minutes, then ~30 s per mutant), so pull requests only mutate the Rust
  # lines they actually change; the one-off full run and its triaged
  # survivors are recorded in docs/mutation-testing.md.
  mutation-testing:
    name: mutation testing (changed lines)
    runs-on: ubuntu-latest
    # Pull requests only: a push to main has no base ref to diff against, and
    # the full-crate run belongs in the recorded spike, not in every merge.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge base with the target branch exists.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-mutants
        # Pinned: a mutant diff is only meaningful against a known mutant set.
        run: cargo install --locked cargo-mutants --version 27.1.0

      - name: Mutate only the lines this PR changes
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          BASE="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          git diff --no-ext-diff --unified=0 "$BASE" HEAD -- '*.rs' > pr.diff
          if [ ! -s pr.diff ]; then
            echo "No Rust changes in this PR -- nothing to mutate."
            exit 0
          fi
          cargo mutants \
            --manifest-path contracts/escrow/Cargo.toml \
            --in-diff pr.diff \
            --jobs 2 \
            --timeout 120

  # Differential testing across Soroban SDK minor versions
  sdk-differential-test:
    name: Differential SDK Version Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        soroban-version: [28.0.0, 29.0.1]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.soroban-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.soroban-version }}-

      - name: Update soroban-sdk version
        run: |
          cd contracts/escrow
          # Update both dependencies and dev-dependencies. Each sed expression
          # is a single-quoted shell string, so it must not contain a stray
          # quote: an earlier version of the dev-dependency pattern ended with
          # `"',` which closed the shell string early and killed the step with
          # "unexpected EOF while looking for matching `'`" before any test ran.
          sed -i 's/soroban-sdk = "[^"]*"/soroban-sdk = "${{ matrix.soroban-version }}"/' Cargo.toml
          sed -i 's/soroban-sdk = { version = "[^"]*"/soroban-sdk = { version = "${{ matrix.soroban-version }}"/' Cargo.toml

      - name: Verify updated version
        working-directory: contracts/escrow
        run: |
          echo "Updated Cargo.toml:"
          grep -A2 -B2 "soroban-sdk" Cargo.toml

      - name: cargo test
        working-directory: contracts/escrow
        run: cargo test --verbose

      # Revert Cargo.toml changes to avoid polluting the repository
      # (this job runs on a copy, so technically not needed, but good practice)
      - name: Revert Cargo.toml changes
        if: always()
        run: |
          cd contracts/escrow
          git checkout Cargo.toml

  # Dependency vulnerability scan (#58): `cargo test` proves the contract
  # behaves; this proves the pinned dependency set itself carries no crate
  # with a known vulnerability. Every crate in Cargo.lock is checked against
  # the RustSec advisory database on every push and PR, so a newly published
  # advisory against something already in the tree turns CI red on the next
  # run instead of being discovered by whoever upgrades last. Softer
  # findings print without failing the run — currently one: `paste`
  # (RUSTSEC-2024-0436, unmaintained, transitive via soroban-env-host and
  # already recorded in deny.toml's [advisories].ignore). A known-
  # vulnerable crate still exits non-zero; if an advisory is ever reviewed
  # and accepted, record it in cargo-audit's config file `.cargo/audit.toml`
  # (cargo-audit discovers its config at `.cargo/audit.toml` or
  # `~/.cargo/audit.toml` — never at an `audit.toml` beside deny.toml, as
  # this comment previously said) and mirror the ID in deny.toml's
  # [advisories].ignore so both scanners accept the same set, rather than
  # removing this job. RUSTSEC-2026-0387 was recorded this way — see both
  # files for its reasoning and re-check condition.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `cargo audit` is a cargo subcommand — it needs a `cargo` on PATH to
      # read the workspace metadata, even though it compiles nothing itself.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt release binary, same installer already used for
      # cargo-llvm-cov above — no minutes spent compiling the scanner.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Check dependencies against the RustSec advisory database
        run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check advisories and bans
        run: cargo deny check advisories bans

      # License compliance (#59): the explicit allowed-license list in
      # deny.toml's [licenses].allow is the whole gate — a future dependency
      # whose license isn't on that list fails here, automatically, instead
      # of being discovered during review (or after release). Kept as its
      # own step so a red run names licenses, not "cargo deny" in general.
      - name: Check licenses
        run: cargo deny check licenses
