name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        working-directory: contracts/escrow
        run: cargo test --verbose

  build-wasm:
    name: stellar contract build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # stellar-cli's dependency tree pulls in libdbus-sys (for keyring
      # support), which needs the system dbus-1 dev headers to compile --
      # not present on ubuntu-latest by default. Without this, `cargo
      # install --locked stellar-cli` fails at build time with "The
      # system library `dbus-1` ... was not found", which broke this job
      # silently for two prior runs (2 Sept 2026) before being noticed.
      - name: Install dbus dev headers (stellar-cli build dependency)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: stellar contract build
        working-directory: .
        run: stellar contract build
