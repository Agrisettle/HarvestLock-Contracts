[package]
name = "harvestlock-factory"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"
harvestlock-escrow = { path = "../escrow" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
harvestlock-escrow = { path = "../escrow", features = ["testutils"] }
